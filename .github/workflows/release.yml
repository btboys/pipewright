# 发版流水线:推送 v* tag 触发。
# GoReleaser 跨平台构建 → GitHub Release(二进制 + 校验和 + changelog)+ ghcr.io 多架构镜像。
#
# 镜像这一段曾经断过,留个记录免得再踩:
#   fe6a437「移除 caddy 镜像构建 workflow」顺手把下面的 ghcr 登录注释掉了 → GoReleaser 改用
#   匿名身份推 ghcr,unauthorized,v1.7.0~v1.11.2 的镜像全部没发出去(ghcr 上只剩 v1.6.0 时期的
#   latest);734cc04 当时用 --skip=docker 绕开,保住了二进制发版,但也把镜像一起停了。
#   现已恢复登录与 packages: write。
#
# 若日后确实要停掉镜像:**必须同时给 goreleaser 加 --skip=docker**(并删掉下面的
# setup-qemu / setup-buildx / login 三段与 permissions 里的 packages: write)。
# 只注释登录而不跳过 docker 会让整条 release 失败 —— 镜像 push 失败发生在 GitHub Release
# 创建之前,表现为 tag 推上去了却什么都没有(v1.7.0 首次失败就是这样)。
# 与 ci.yml(每次 push/PR 跑测试)正交;此处只在打 tag 时跑。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 GitHub Release、上传产物
  packages: write # 推送镜像到 ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # GoReleaser 需要完整历史与 tag 生成 changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # 多架构镜像构建所需:QEMU(跨架构模拟)+ buildx。
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 登录 ghcr.io,用 workflow 自带 GITHUB_TOKEN,无需额外配置密钥。
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
