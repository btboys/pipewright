# 发版流水线:推送 v* tag 触发。
# GoReleaser 跨平台构建 → GitHub Release(二进制 + 校验和 + changelog)。
# 只发二进制,不发容器镜像:GoReleaser 仍配置了 ghcr 的 docker/docker_manifests,
# 但此处 --skip=docker 跳过整个 docker 发布阶段,故无需 docker login。
# 若日后要恢复镜像发布:去掉 --skip=docker,并按 git 历史补回
# docker/login-action(ghcr.io + secrets.GITHUB_TOKEN)与 setup-qemu/setup-buildx 三步,
# 同时恢复上面 permissions 里的 packages: write。
# 与 ci.yml(每次 push/PR 跑测试)正交;此处只在打 tag 时跑。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 GitHub Release、上传产物

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # GoReleaser 需要完整历史与 tag 生成 changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
